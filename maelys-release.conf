# What the socle declares to itself, as a product declares to it.

[ci]
# The socle's CI is .github/workflows/check.yml and nothing else: it lints the
# workflows it ships, shellchecks the scripts it installs, runs its own tests,
# checks this repository against its own conventions and its CLI reference
# against describe. check-product.yml is written for compiled products --
# `make check` on three platforms, sanitizers -- and this is a Python program
# with no Makefile.
own

[dependencies]
# The pins -- agent-cli-spec, whose kit the conformance test runs, and
# maelys-cli, whose framework is vendored and whose generator writes
# docs/cli.md -- are read from $MAELYS_DEPENDENCIES_DIR or fetched at their
# commit, never from a working copy beside this one.
apart
