name: verify-tag (reusable)

# The tag gate of release.yml, for a product that deploys its own way: a site
# or a Worker whose mechanism is `custom`, which goes out by a deploy job of
# its own rather than by the socle's publish. It is called before that job:
#
#   jobs:
#     tag:
#       uses: maelys-dev/maelys-release/.github/workflows/verify-tag.yml@SHA # vX.Y.Z
#     deploy:
#       needs: tag
#       environment: release
#       ...
#
# and refuses, with the words release.yml would use, a tag that does not
# name VERSION, is not annotated, is not verified by GitHub, does not name
# the commit checked out, is not signed by a key the socle names, or was
# run by another socle than the one the calling workflow pins on that line.
# The checks are .github/scripts/verify-tag.sh, the same file release.yml
# runs, fetched from the socle at the commit this job runs.
#
# It holds no secret and reads only: the product's tag and commit, and the
# socle's public files.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing signed tag to verify; defaults to the triggering tag
        required: false
        type: string
        default: ""
      commit_verification:
        description: >-
          What the tag's commit must satisfy, beyond the signed annotated
          tag: none, signed (its own signature verified by GitHub), or
          signed-on-default-branch (also an ancestor of the default branch,
          so a tag cannot deploy a commit that never landed).
        required: false
        type: string
        default: none
      runner:
        description: >-
          The runner of the gate, as a JSON label string or label array: it
          needs bash, git, gh, jq and ssh-keygen.
        required: false
        type: string
        default: '"ubuntu-26.04"'
    outputs:
      tag:
        description: The tag verified, vX.Y.Z
        value: ${{ jobs.verify.outputs.tag }}
      version:
        description: The version it names, X.Y.Z
        value: ${{ jobs.verify.outputs.version }}
      commit:
        description: The commit it names, which the gate checked out
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Bounded, because nothing else can bound it: GitHub refuses
    # timeout-minutes on a job that calls a reusable workflow, so the
    # product cannot cut this one if it hangs. As release.yml's verify.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      # The same step as release.yml's, byte for byte.
      - name: Fetch the tag gate of the socle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOCLE: ${{ job.workflow_repository }}
          SOCLE_SHA: ${{ job.workflow_sha }}
        shell: bash
        # The commit is checked before anything is read at it: an empty one
        # would read the socle's default branch, which no product pinned.
        run: |
          set -euo pipefail
          refuse() { echo "$1" >&2; exit 1; }
          test -n "$SOCLE_SHA" || refuse "the socle judging ${TAG} is unknown: job.workflow_sha is empty"
          test -n "$SOCLE" || refuse "the socle judging ${TAG} is unknown: job.workflow_repository is empty"
          case "$SOCLE_SHA" in
            *[!0-9a-f]*|"") refuse "the socle judging ${TAG} is not a commit: ${SOCLE_SHA}" ;;
          esac
          test "${#SOCLE_SHA}" = 40 || refuse "the socle judging ${TAG} is not a commit: ${SOCLE_SHA}"
          gh api "repos/${SOCLE}/contents/.github/scripts/verify-tag.sh?ref=${SOCLE_SHA}" --jq .content \
            >"$RUNNER_TEMP/verify-tag.b64" \
            || refuse "${SOCLE} at ${SOCLE_SHA} has no .github/scripts/verify-tag.sh, or this token cannot read it"
          base64 -d <"$RUNNER_TEMP/verify-tag.b64" >"$RUNNER_TEMP/verify-tag.sh"
          test -s "$RUNNER_TEMP/verify-tag.sh" \
            || refuse "${SOCLE} at ${SOCLE_SHA} carries an empty .github/scripts/verify-tag.sh"
      - name: Name the workflow that calls this gate
        id: caller
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: bash "$RUNNER_TEMP/verify-tag.sh" caller
      - name: Verify version and signed annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash "$RUNNER_TEMP/verify-tag.sh" tag
      - name: Verify the tag was signed by a key the fleet names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOCLE: ${{ job.workflow_repository }}
          SOCLE_SHA: ${{ job.workflow_sha }}
          # The caller pins this gate, not release.yml: the line that must
          # name the commit this job runs is its `uses:` of verify-tag.yml.
          PIN_FILE: ${{ steps.caller.outputs.file }}
          PIN_WORKFLOW: verify-tag.yml
        shell: bash
        run: bash "$RUNNER_TEMP/verify-tag.sh" signer
      - name: Verify the tag's commit
        if: inputs.commit_verification != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.commit_verification }}
        shell: bash
        run: bash "$RUNNER_TEMP/verify-tag.sh" commit
