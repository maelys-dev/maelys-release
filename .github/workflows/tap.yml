name: homebrew tap (reusable)

# Renders the product's formula from the released tag's own template, builds
# bottles on the requested macOS runners, attaches them to the GitHub release,
# merges their digests into the formula and pushes a signed commit to the
# shared Homebrew tap. Without tap credentials the publish step renders,
# lints, prints the diff and succeeds, so a release never fails on a missing
# secret. The formula keeps its source URL: bottles are an addition.
#
# Every product pushes to the same tap. The publish job runs one at a time
# per tap within the calling repository (concurrency group), and its push
# fetches, rebases and retries when another product's formula landed first,
# since GitHub scopes a concurrency group to one repository.
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      tag:
        description: Release tag; defaults to the pushed tag
        required: false
        type: string
        default: ""
      formula_template:
        description: Template path inside the product repository
        required: false
        type: string
        default: ""
      render_command:
        description: Command rendering the formula; TAG and OUTPUT are substituted
        required: false
        type: string
        default: ""
      bottles:
        description: JSON array of macOS runner labels that build bottles; [] disables them
        required: false
        type: string
        default: "[]"
      tap_repository:
        required: false
        type: string
        default: maelys-dev/homebrew-tap
      attestation:
        description: auto (by repository visibility), always or never, as in release.yml
        required: false
        type: string
        default: auto
      macos_runner:
        description: >-
          JSON runner for render and publish (both need brew, not a
          bottle build): a label string such as "macos-15", or a label
          array for a self-hosted runner. The self-hosted default applies
          only on a private repository (one runner per repository,
          registered at the repository and never the organization); a
          public repository always runs macos-15.
        required: false
        type: string
        default: '["self-hosted","macOS","ARM64"]'
      release_environment:
        required: false
        type: string
        default: release
    secrets:
      tap_token:
        required: false
      tap_signing_key:
        required: false

permissions:
  contents: read

jobs:
  render:
    environment: ${{ inputs.release_environment }}
    runs-on: ${{ github.event.repository.private && fromJSON(inputs.macos_runner) || 'macos-15' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Render the formula for the released tag
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          INPUT_TAG: ${{ inputs.tag }}
          TEMPLATE: ${{ inputs.formula_template }}
          RENDER_COMMAND: ${{ inputs.render_command }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          output="dist/homebrew/${PRODUCT}.rb"
          mkdir -p dist/homebrew
          if [ -n "$RENDER_COMMAND" ]; then
            command="${RENDER_COMMAND//TAG/$tag}"
            eval "${command//OUTPUT/$output}"
          else
            template="${TEMPLATE:-packaging/homebrew/${PRODUCT}.rb.in}"
            url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
            curl -fsSL --retry 5 -o /tmp/source.tar.gz "$url"
            digest="$(shasum -a 256 /tmp/source.tar.gz | awk '{print $1}')"
            mkdir -p /tmp/tag && tar -xzf /tmp/source.tar.gz -C /tmp/tag --strip-components=1
            sed -e "s|@URL@|$url|g" -e "s|@VERSION@|${tag#v}|g" -e "s|@SHA256@|$digest|g" \
              "/tmp/tag/$template" >"$output"
            if grep -q '@[A-Z0-9_]*@' "$output"; then
              echo "unrendered placeholder in $output" >&2
              exit 1
            fi
          fi
          brew style "$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula-${{ inputs.product }}
          path: dist/homebrew/

  bottle:
    needs: render
    if: inputs.bottles != '[]'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.bottles) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula-${{ inputs.product }}
          path: formula
      - name: Build the bottle from the rendered formula
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          INPUT_TAG: ${{ inputs.tag }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          test "$(uname -m)" = arm64
          brew tap-new maelys-dev/staging >/dev/null
          # Recent Homebrew refuses to load formulas from a tap it does not trust.
          brew trust maelys-dev/staging >/dev/null 2>&1 || true
          # The shared tap resolves the product's Maelys dependencies (depends_on).
          shared_tap="${TAP_REPOSITORY%/homebrew-*}/${TAP_REPOSITORY#*/homebrew-}"
          brew tap "$shared_tap"
          brew trust "$shared_tap" >/dev/null 2>&1 || true
          tap="$(brew --repository maelys-dev/staging)"
          cp "formula/${PRODUCT}.rb" "$tap/Formula/${PRODUCT}.rb"
          brew install --build-bottle "maelys-dev/staging/${PRODUCT}"
          mkdir -p bottles && cd bottles
          brew bottle --json --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            "maelys-dev/staging/${PRODUCT}"
          # Homebrew writes NAME--VERSION locally but references NAME-VERSION at root_url.
          for file in ./*--*; do mv "$file" "${file/--/-}"; done
          ls -l
      - name: Provenance attestation
        if: inputs.attestation == 'always' || (inputs.attestation == 'auto' && !github.event.repository.private)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bottles/*.bottle.tar.gz
      - name: Attach the bottle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "$tag" --repo "${GITHUB_REPOSITORY}" --clobber bottles/*.bottle.tar.gz bottles/*.bottle.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-bottle-${{ inputs.product }}-${{ matrix.runner }}
          path: bottles/*.bottle.json

  publish:
    needs: [render, bottle]
    if: always() && needs.render.result == 'success' && (needs.bottle.result == 'success' || needs.bottle.result == 'skipped')
    environment: ${{ inputs.release_environment }}
    runs-on: ${{ github.event.repository.private && fromJSON(inputs.macos_runner) || 'macos-15' }}
    # One publication at a time per tap in this repository: the formula jobs
    # of one release, or a replay during a release, wait for each other
    # instead of racing on the push. GitHub scopes the group to the
    # repository and keeps one pending job per group, so another product's
    # publication still runs concurrently; the push step rebases and retries
    # for that case.
    concurrency:
      group: tap-${{ inputs.tap_repository }}
      cancel-in-progress: false
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HAS_TAP_TOKEN: ${{ secrets.tap_token != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula-${{ inputs.product }}
          path: formula
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.bottle.result == 'success'
        with:
          pattern: homebrew-bottle-${{ inputs.product }}-*
          path: bottles
          merge-multiple: true
      - name: Merge bottle digests into the formula
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          brew tap-new maelys-dev/staging >/dev/null
          # Recent Homebrew refuses to load formulas from a tap it does not trust.
          brew trust maelys-dev/staging >/dev/null 2>&1 || true
          # No shared tap here: brew style would see the product's class twice
          # (staging and shared) and fail on Lint/DuplicateMethods.
          tap="$(brew --repository maelys-dev/staging)"
          cp "formula/${PRODUCT}.rb" "$tap/Formula/${PRODUCT}.rb"
          if ls bottles/*.bottle.json >/dev/null 2>&1; then
            brew bottle --merge --write --no-commit bottles/*.bottle.json
          fi
          cp "$tap/Formula/${PRODUCT}.rb" "formula/${PRODUCT}.rb"
          # Style the copy inside the staging tap: styling the loose file while
          # the tap holds the same class fails on Lint/DuplicateMethods.
          brew style "$tap/Formula/${PRODUCT}.rb"
      - name: Publish to the tap
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          INPUT_TAG: ${{ inputs.tag }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
          TAP_TOKEN: ${{ secrets.tap_token }}
          TAP_SIGNING_KEY: ${{ secrets.tap_signing_key }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Push HEAD of the clone DIR to BRANCH of the tap. A rejected push
          # means another publication landed first: fetch, rebase the commit
          # onto the branch and push again, at most ATTEMPTS times. Each
          # product owns its own Formula/NAME.rb, so the rebase conflicts only
          # when the same formula is published twice at once, which the
          # signed-tag model excludes; then the rebase is aborted and the
          # publication fails instead of guessing.
          push_rebased() {
            local dir="$1" branch="$2" attempts="$3" attempt
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if git -C "$dir" push -q origin "HEAD:$branch"; then
                echo "pushed to $branch on attempt $attempt of $attempts"
                return 0
              fi
              echo "push to $branch rejected on attempt $attempt of $attempts"
              if [ "$attempt" -lt "$attempts" ]; then
                git -C "$dir" fetch -q origin "$branch"
                if ! git -C "$dir" rebase -q "origin/$branch"; then
                  git -C "$dir" rebase --abort
                  echo "rebase onto origin/$branch conflicts: the tap received another change of the same formula" >&2
                  return 1
                fi
              fi
            done
            echo "push to $branch rejected $attempts times" >&2
            return 1
          }
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tmp="$(mktemp -d)"
          if [ "$HAS_TAP_TOKEN" = "true" ]; then
            git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$tmp/tap"
          else
            git clone -q "https://github.com/${TAP_REPOSITORY}.git" "$tmp/tap"
          fi
          mkdir -p "$tmp/tap/Formula"
          cp "formula/${PRODUCT}.rb" "$tmp/tap/Formula/${PRODUCT}.rb"
          git -C "$tmp/tap" add "Formula/${PRODUCT}.rb"
          if git -C "$tmp/tap" diff --cached --quiet; then
            echo "tap already carries ${PRODUCT} ${tag#v}"
            exit 0
          fi
          if [ "$HAS_TAP_TOKEN" != "true" ]; then
            echo "::notice::no tap credentials configured; the rendered formula is kept as an artifact"
            git -C "$tmp/tap" diff --cached --stat
            exit 0
          fi
          # Identity and signing live in the clone's configuration, so the
          # commit and any rebase of it are signed alike.
          git -C "$tmp/tap" config user.name "${ACTOR}"
          git -C "$tmp/tap" config user.email "${ACTOR}@users.noreply.github.com"
          if [ -n "$TAP_SIGNING_KEY" ]; then
            printf '%s\n' "$TAP_SIGNING_KEY" >"$tmp/signing-key"
            chmod 0600 "$tmp/signing-key"
            git -C "$tmp/tap" config gpg.format ssh
            git -C "$tmp/tap" config user.signingkey "$tmp/signing-key"
            git -C "$tmp/tap" config commit.gpgsign true
          fi
          git -C "$tmp/tap" commit -q -m "Update ${PRODUCT} to ${tag#v}"
          push_rebased "$tmp/tap" main 3
          echo "brew install ${TAP_REPOSITORY%/homebrew-*}/${TAP_REPOSITORY#*/homebrew-}/${PRODUCT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula-${{ inputs.product }}-published
          path: formula/
