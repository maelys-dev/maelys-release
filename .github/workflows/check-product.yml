name: check (reusable)

# Reusable CI of one Maelys product, from the same declarations as its
# release and without repeating them: the job fetches the socle that the
# product's release.yml pins, asks it for the pinned dependencies and the
# packages of dependencies/packages, installs them, runs `make check` on the
# three release targets, the sanitizers on Linux x86_64 with clang, and
# the socle drift check. The product's ci.yml calls it as one job and adds
# its own jobs next to it. A release is never the first Linux run of a
# product.
on:
  workflow_call:
    inputs:
      product:
        description: Product name, as given to maelys-release adopt
        required: true
        type: string
      check_command:
        required: false
        type: string
        default: make check
      sanitizer_command:
        description: Run on Linux x86_64 with clang; empty disables the job
        required: false
        type: string
        default: make asan-ubsan
      # Accepted for ci.yml files created by maelys-release 0.5.0; ignored
      # since 0.6.0, when the job started reading the product's declarations itself.
      dependency_checkout:
        required: false
        type: string
        default: ""
      linux_packages:
        required: false
        type: string
        default: ""
      macos_packages:
        required: false
        type: string
        default: ""
      docs_contract:
        description: >-
          Refuse prose in docs/ and a CLI reference outside docs/cli.md.
          A product opts in once its prose has moved to maelys-docs.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the socle this workflow comes from
        id: socle
        shell: bash
        # The socle commit is read from the product's release.yml when the
        # socle generated it, and otherwise from the ci.yml line that calls
        # this very workflow: a product that keeps a release mechanism of
        # its own still names the socle there, and can use this CI.
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            sha="$(sed -n 's|.*maelys-release/.github/workflows/check-product\.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/*.yml | head -n 1)"
          fi
          test -n "$sha" || { echo "no workflow of this repository names a maelys-release commit" >&2; exit 1; }
          socle="$RUNNER_TEMP/maelys-release"
          git init -q "$socle"
          git -C "$socle" fetch -q --depth 1 https://github.com/maelys-dev/maelys-release.git "$sha"
          git -C "$socle" checkout -q FETCH_HEAD
          echo "dir=$socle" >>"$GITHUB_OUTPUT"
          "$socle/bin/maelys-release" declarations . --product "${{ inputs.product }}" --format json --compact >"$RUNNER_TEMP/declarations.json"
          python3 - "$RUNNER_TEMP/declarations.json" >>"$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]
          print("dependencies=" + " ".join(data["dependencies"]))
          print("linux_packages=" + data["linuxPackages"])
          print("macos_packages=" + data["macosPackages"])
          PY
      - name: Pinned dependency checkouts
        if: steps.socle.outputs.dependencies != ''
        shell: bash
        run: |
          set -euo pipefail
          for name in ${{ steps.socle.outputs.dependencies }}; do sh scripts/checkout-dependency.sh "$name"; done
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang ${{ steps.socle.outputs.linux_packages }}
      - name: Install macOS packages
        if: runner.os == 'macOS' && steps.socle.outputs.macos_packages != ''
        run: brew install ${{ steps.socle.outputs.macos_packages }}
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Check
        shell: bash
        run: ${{ inputs.check_command }}
      - name: Release socle drift
        if: matrix.runner == 'ubuntu-26.04'
        shell: bash
        # The socle pinned by release.yml is the pin of record: check from
        # that checkout regenerates the managed files and fails on any drift,
        # including declarations changed without adopt --apply.
        run: |
          ${{ steps.socle.outputs.dir }}/bin/maelys-release check . --product "${{ inputs.product }}" \
            ${{ inputs.docs_contract && '--docs-contract' || '' }}

  sanitizers:
    if: inputs.sanitizer_command != ''
    runs-on: ubuntu-26.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the socle this workflow comes from
        id: socle
        shell: bash
        # The socle commit is read from the product's release.yml when the
        # socle generated it, and otherwise from the ci.yml line that calls
        # this very workflow: a product that keeps a release mechanism of
        # its own still names the socle there, and can use this CI.
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            sha="$(sed -n 's|.*maelys-release/.github/workflows/check-product\.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/*.yml | head -n 1)"
          fi
          test -n "$sha" || { echo "no workflow of this repository names a maelys-release commit" >&2; exit 1; }
          socle="$RUNNER_TEMP/maelys-release"
          git init -q "$socle"
          git -C "$socle" fetch -q --depth 1 https://github.com/maelys-dev/maelys-release.git "$sha"
          git -C "$socle" checkout -q FETCH_HEAD
          "$socle/bin/maelys-release" declarations . --product "${{ inputs.product }}" --format json --compact >"$RUNNER_TEMP/declarations.json"
          python3 - "$RUNNER_TEMP/declarations.json" >>"$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]
          print("dependencies=" + " ".join(data["dependencies"]))
          print("linux_packages=" + data["linuxPackages"])
          PY
      - name: Pinned dependency checkouts
        if: steps.socle.outputs.dependencies != ''
        shell: bash
        run: |
          set -euo pipefail
          for name in ${{ steps.socle.outputs.dependencies }}; do sh scripts/checkout-dependency.sh "$name"; done
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-rt-18-dev ${{ steps.socle.outputs.linux_packages }}
      - name: Sanitizers with clang
        shell: bash
        run: ${{ inputs.sanitizer_command }} CC=clang CXX=clang++
