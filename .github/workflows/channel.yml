name: channel (reusable)

# Publishes one product to one registry, after its GitHub release is public,
# and attaches one marker asset saying that it did.
# A channel lives here rather than in release.yml because the permissions of
# a called workflow are static: they cannot depend on what a product
# declares, and the scope a registry needs differs from one to the next. A
# product without a channel never calls this workflow and never receives its
# scopes.
#
# Ordering is deliberate. The release is published first because it can be
# redrafted; a registry publication cannot be withdrawn, so nothing the socle
# runs may fail after it. A replay therefore re-runs this workflow on a
# version the registry already holds: publish_command must succeed without
# republishing, the way tap.yml treats a formula it already carries.
on:
  workflow_call:
    inputs:
      product:
        description: Package name, for example maelys-datalog
        required: true
        type: string
      tag:
        description: The published tag this channel carries
        required: true
        type: string
      channel:
        description: Name of the channel, as declared in packaging/release
        required: true
        type: string
      publish_command:
        description: >-
          Command publishing one channel; TAG and CHANNEL are substituted. It
          runs at the tag, with the release assets in dist/, and must exit 0
          without republishing when the registry already holds the version.
        required: true
        type: string
      linux_x86_64_runner:
        description: >-
          Runner for every job of this workflow; a JSON label string or
          array. Honoured unconditionally: this workflow is reached only
          through a release of a signed tag, which needs write access to the
          repository. Its publish job checks the product out and runs its
          script.
        required: false
        type: string
        default: '"ubuntu-26.04"'
      release_environment:
        description: Environment holding the human gate; the same one release.yml uses
        required: false
        type: string
        default: release

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ fromJSON(inputs.linux_x86_64_runner) }}
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Collect the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        # The channel publishes what the release published, not a rebuild:
        # two builds of one tag are two sets of bytes.
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir dist
          # Not the markers of the channels that published before this one.
          # They are assets of the release like any other, so they landed in
          # the directory a publish script reads, and a script that ships
          # dist/* would push another channel's receipt to a registry. They
          # have been there since 0.32.0 put them on the release.
          rm -f dist/channel-*.json
          test -n "$(ls dist)"
      - name: Publish the channel
        id: publish
        env:
          PUBLISH_COMMAND: ${{ inputs.publish_command }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ inputs.product }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          # A script with something to record about its publication writes a
          # JSON object here. It is optional: the socle records the fact of
          # publishing without it.
          CHANNEL_RECORD: ${{ runner.temp }}/channel-record.json
        shell: bash
        run: |
          set -euo pipefail
          command="${PUBLISH_COMMAND//TAG/$TAG}"
          eval "${command//CHANNEL/$CHANNEL}"
          echo "::notice::$PRODUCT $TAG published on the $CHANNEL channel"
          # The shell decides whether the script recorded anything, not
          # hashFiles: that function only sees GITHUB_WORKSPACE, and
          # runner.temp is outside it, so the condition it guarded was empty
          # for every product since 0.32.0. The step below never ran, the
          # marker was composed without a single recorded field, and
          # `rehearse --channel` reported a disagreement on each of them --
          # which is how this was found, by the one thing that compares the
          # two markers.
          if [ -s "$CHANNEL_RECORD" ]; then echo "recorded=true" >>"$GITHUB_OUTPUT"; fi
      - name: Keep what the script recorded
        if: steps.publish.outputs.recorded == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channel-record-${{ inputs.channel }}
          path: ${{ runner.temp }}/channel-record.json
          retention-days: 1

  # The marker of a publication that happened, written by a job that runs no
  # code of the product. `needs` is what makes it an observation and never an
  # intention: this job does not start unless the publication succeeded, so
  # the asset exists if and only if the channel published. A receipt rewritten
  # after the fact could say otherwise, and two channels publishing in
  # parallel would lose one another's entry on the clobber.
  record:
    needs: publish
    runs-on: ${{ fromJSON(inputs.linux_x86_64_runner) }}
    permissions:
      contents: write
    steps:
      - name: Collect what the script recorded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: channel-record-${{ inputs.channel }}
          path: recorded
      - name: Attach the channel marker
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ inputs.product }}
          RUN: ${{ github.run_id }}
        shell: bash
        # One asset per channel, written once and never rewritten: the
        # manifest cannot cover a mutable asset, and SHA256SUMS does not
        # claim anything about a registry.
        run: |
          set -euo pipefail
          # A marker already attached is the record of when this channel
          # published, and a replay does not publish again -- the contract
          # of publish_command is to exit 0 without republishing. Writing a
          # second one would move `published` and `run` onto a replay that
          # did nothing, which is the one thing a marker must not do. No
          # --clobber here for the same reason: it would overwrite silently.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets \
               --jq '.assets[].name' | grep -qx "channel-$CHANNEL.json"; then
            echo "::notice::$TAG already carries channel-$CHANNEL.json, written when $CHANNEL published; this run leaves it as it stands"
            exit 0
          fi
          published="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A marker says these four things about a registry and nothing
          # else. Without the list every product invents its own field, and
          # `rehearse --channel` then compares what the script chose to write
          # with what the release carries -- a product compared with itself,
          # which proves nothing common. A string value, because a marker is
          # read by eye as often as by jq.
          record="$(cat recorded/channel-record.json 2>/dev/null || echo '{}')"
          jq -e 'type == "object"' >/dev/null 2>&1 <<<"$record" || {
            echo "::warning::channel-record.json is not a JSON object; the marker carries the socle's fields alone"
            record='{}'
          }
          extra="$(jq -r '[to_entries[] | select((.key | IN("registry","package","version","dist_tag") | not)
                                                 or (.value | type != "string")) | .key] | join(" ")' <<<"$record")"
          if [ -n "$extra" ]; then
            # Dropped and not refused: the publication has already happened,
            # so failing here would leave a registry holding a version and a
            # release saying nothing about it.
            echo "::warning::channel-record.json carries $extra, which a marker does not: it holds registry, package, version and dist_tag, as strings"
          fi
          kept="$(jq -c '[to_entries[] | select((.key | IN("registry","package","version","dist_tag"))
                                                and (.value | type == "string"))] | from_entries' <<<"$record")"
          # The socle's fields last: they cannot be overwritten by a record
          # naming `tag`, which the former expression would have let through
          # onto the release that tag names.
          jq -n --arg product "$PRODUCT" --arg tag "$TAG" --arg channel "$CHANNEL" \
                --arg published "$published" --arg run "$RUN" --argjson kept "$kept" \
            '$kept + {product: $product, tag: $tag, channel: $channel, published: $published,
                      run: "https://github.com/\(env.GITHUB_REPOSITORY)/actions/runs/\($run)"}' \
            >"channel-$CHANNEL.json"
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" "channel-$CHANNEL.json"
          echo "::notice::$PRODUCT $TAG carries channel-$CHANNEL.json"

  said:
    # A channel that fails leaves the release page saying nothing. The
    # release job is green, this workflow is red, and the two are not the
    # same page: a reader who lands on the release sees assets, a manifest
    # and no hint that a registry was meant to hold this version and does
    # not. The absent marker is the honest record for a machine; this is
    # the honest record for a person, written where they are looking.
    # maelys-datalog asked for it after its npm channel failed on a
    # publish command that had never run.
    # record too, and not publish alone: a marker that fails to attach
    # leaves the same silence on the release page as a publication that
    # failed, and the reader cannot tell the two apart from there.
    needs: [publish, record]
    if: always() && (needs.publish.result != 'success' || needs.record.result != 'success')
    runs-on: ${{ fromJSON(inputs.linux_x86_64_runner) }}
    permissions:
      contents: write
    steps:
      - name: Say on the release what this channel left undone
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          RUN: ${{ github.run_id }}
          PUBLISHED: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Two different facts, and saying the first when the second
          # happened would be a lie on a public page: a registry that holds
          # this version, described as one that does not.
          if [ "$PUBLISHED" = success ]; then
            said="published, and the release carries no marker for it"
          else
            said="not published"
          fi
          line="Channel \`$CHANNEL\`: $said (run https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN)."
          body="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          # Replayed on the same tag, this must not say it twice.
          case "$body" in
            *"Channel \`$CHANNEL\`: $said"*)
              echo "::notice::the release of $TAG already says $CHANNEL $said"
              exit 0 ;;
          esac
          printf '%s\n\n---\n\n%s\n' "$body" "$line" >"${RUNNER_TEMP}/body.md"
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/body.md"
          echo "::notice::the release of $TAG now says channel $CHANNEL $said"
