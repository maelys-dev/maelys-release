name: release (reusable)

# Reusable release of one Maelys product on a signed tag: verify the tag and
# VERSION, build the packages on every target and attest their provenance,
# then publish one GitHub release with SHA256SUMS. The build holds no write
# token: it hands its artifacts to publish, which is the only job that may
# write, and the human gate stands in front of that one job. The targets and the archive
# kinds the manifest covers are inputs (`targets`, `manifest_patterns`), so a
# product builds what it needs. On a private repository the
# attestation is skipped (input `attestation`). The product supplies
# `scripts/package-release.sh TARGET` writing into dist/, its `dependencies/` pins
# and packages. Runner inputs are JSON: a label string such as "macos-15" or
# a label array such as ["self-hosted","macOS","ARM64"].
on:
  workflow_call:
    inputs:
      product:
        description: Package and binary name, for example maelys-egress
        required: true
        type: string
      tag:
        description: Existing signed tag to release; defaults to the triggering tag
        required: false
        type: string
        default: ""
      dependency_checkout:
        description: Shell lines run before packaging (pinned dependency checkouts)
        required: false
        type: string
        default: ""
      linux_packages:
        description: apt packages installed on Linux runners
        required: false
        type: string
        default: build-essential dpkg-dev file rpm
      macos_packages:
        description: brew packages installed on macOS runners
        required: false
        type: string
        default: ""
      verify_command:
        description: >-
          Command run on each target runner before packaging, TARGET
          substituted; empty runs none. The release builds what the tag
          names, so a product that wants its tests replayed on that exact
          commit asks here.
        required: false
        type: string
        default: ""
      package_command:
        description: Command producing dist/ for one target; TARGET is substituted
        required: false
        type: string
        default: bash scripts/package-release.sh TARGET
      targets:
        description: >-
          JSON array of the targets to build, one {"target": …, "runner": …}
          each, where runner is a JSON label string or label array as the
          *_runner inputs are, and may be omitted for one of the three
          targets below to keep taking its runner from them. Empty builds
          those three; a non-empty value replaces the matrix entirely.
        required: false
        type: string
        default: ""
      manifest_patterns:
        description: >-
          Space-separated globs naming the archive kinds SHA256SUMS covers
          and, since the build stopped writing to the draft, the kinds that
          reach the release at all: publish copies from the build's
          artifacts what matches these globs or *.sha256, and nothing else.
          A file dist/ holds outside them is attested and never published.
          The default is the three kinds the socle has always listed; a
          product publishing another one, a wasm bundle or a build receipt,
          names it here.
        required: false
        type: string
        default: '*.tar.gz *.deb *.rpm'
      sbom_pattern:
        description: >-
          Glob of the SBOM a build leaves in dist/, SPDX or CycloneDX. Empty
          by default, which attests nothing beyond provenance. When it names
          a document, the release does not guess what that document
          describes: it reads the subject the document names itself (SPDX
          DESCRIBES or documentDescribes, CycloneDX metadata.component),
          requires that file to exist in this target's dist/, and requires
          its SHA-256 to equal the one the document records. A document that
          names no subject, or names one whose digest differs, stops the
          release rather than producing a link nobody can rely on. One
          document per target: an attestation carries one predicate.
        required: false
        type: string
        default: ''
      linux_x86_64_runner:
        required: false
        type: string
        default: '"ubuntu-26.04"'
      linux_arm64_runner:
        required: false
        type: string
        default: '"ubuntu-26.04-arm"'
      macos_runner:
        required: false
        type: string
        default: '"macos-15"'
      release_environment:
        required: false
        type: string
        default: release
      commit_verification:
        description: >-
          What the tag's commit must satisfy, beyond the signed annotated
          tag: none, signed (its own signature verified by GitHub), or
          signed-on-default-branch (also an ancestor of the default branch,
          so a tag cannot publish a commit that never landed).
        required: false
        type: string
        default: none
      attestation:
        description: >-
          auto attests provenance on a public repository and skips it on a
          private one (GitHub reserves attestations there to paid plans);
          always and never force it. Its subject is dist/*, so every file
          package_command leaves there is attested, an SBOM included.
        required: false
        type: string
        default: auto
    outputs:
      tag:
        value: ${{ jobs.verify.outputs.tag }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify version and signed annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "v$(cat VERSION)" = "$TAG"
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r .object.type <<<"$ref")" = tag || { echo "$TAG is not an annotated tag" >&2; exit 1; }
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref")")"
          test "$(jq -r .verification.verified <<<"$object")" = true || { echo "$TAG is not verified by GitHub" >&2; exit 1; }
          head="$(git rev-parse HEAD)"
          test "$(jq -r .object.sha <<<"$object")" = "$head" || { echo "$TAG does not name $head" >&2; exit 1; }
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
      - name: Verify the tag's commit
        if: inputs.commit_verification != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.commit_verification }}
        shell: bash
        # A signed tag says who published; this says what was published: the
        # commit carries its own verified signature, and optionally landed on
        # the default branch through the branch's own rules.
        run: |
          set -euo pipefail
          case "$MODE" in
            signed|signed-on-default-branch) ;;
            *) echo "commit_verification must be none, signed or signed-on-default-branch, not $MODE" >&2; exit 1 ;;
          esac
          head="$(git rev-parse HEAD)"
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}")"
          test "$(jq -r .commit.verification.verified <<<"$commit")" = true \
            || { echo "the commit $head is not signed and verified by GitHub" >&2; exit 1; }
          if [ "$MODE" = signed-on-default-branch ]; then
            branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
            git fetch -q origin "$branch"
            git merge-base --is-ancestor "$head" "origin/$branch" \
              || { echo "the commit $head is not an ancestor of $branch: it never landed there" >&2; exit 1; }
          fi
      - name: Resolve the build matrix
        id: matrix
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          LINUX_X86_64_RUNNER: ${{ inputs.linux_x86_64_runner }}
          LINUX_ARM64_RUNNER: ${{ inputs.linux_arm64_runner }}
          MACOS_RUNNER: ${{ inputs.macos_runner }}
        # The matrix is resolved here rather than written in the build job so
        # a product can name targets the socle does not know. A target that
        # omits its runner and is one of the three keeps taking it from the
        # runner inputs, so changing a default runner still reaches every
        # product that only added a target.
        run: |
          set -euo pipefail
          if [ -z "$TARGETS" ]; then
            matrix="$(jq -nc --arg x "$LINUX_X86_64_RUNNER" --arg a "$LINUX_ARM64_RUNNER" --arg m "$MACOS_RUNNER" \
              '{include: [{target: "linux-x86_64", runner: $x},
                          {target: "linux-arm64", runner: $a},
                          {target: "macos-arm64", runner: $m}]}')"
          else
            jq -e 'type == "array" and length > 0' <<<"$TARGETS" >/dev/null \
              || { echo "targets must be a non-empty JSON array" >&2; exit 1; }
            jq -e 'all(.target? | type == "string" and length > 0)' <<<"$TARGETS" >/dev/null \
              || { echo "every entry of targets needs a non-empty target" >&2; exit 1; }
            matrix="$(jq -c --arg x "$LINUX_X86_64_RUNNER" --arg a "$LINUX_ARM64_RUNNER" --arg m "$MACOS_RUNNER" '
              def inherited:
                {"linux-x86_64": $x, "linux-arm64": $a, "macos-arm64": $m}[.]
                // error("the target \(.) names no runner and the socle has no default for it");
              {include: [.[] | {target: .target,
                                runner: (if has("runner") then (.runner | tojson) else (.target | inherited) end)}]}
            ' <<<"$TARGETS")"
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "::notice::building $(jq -r '.include | map(.target) | join(", ")' <<<"$matrix")"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      # The job that runs the product's own package_command holds no write
      # token. contents: write here is repository-wide: it can rewrite the
      # assets of releases already published, push to any branch, and create
      # tags. A compromised toolchain in this job had the repository, not
      # just a draft.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}
      - name: Pinned dependency checkouts
        if: inputs.dependency_checkout != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.dependency_checkout }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && inputs.linux_packages != ''
        # The runner image carries third-party apt sources of its own; one of
        # them breaking must not fail an install of Ubuntu archive packages.
        # The update reports, the install decides.
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y ${{ inputs.linux_packages }}
      - name: Install macOS packages
        if: runner.os == 'macOS' && inputs.macos_packages != ''
        run: brew install ${{ inputs.macos_packages }}
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Verify before packaging
        if: inputs.verify_command != ''
        shell: bash
        env:
          VERIFY_COMMAND: ${{ inputs.verify_command }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "${VERIFY_COMMAND//TARGET/$TARGET}"
      - name: Package
        shell: bash
        env:
          PACKAGE_COMMAND: ${{ inputs.package_command }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "${PACKAGE_COMMAND//TARGET/$TARGET}"
          test -n "$(ls dist 2>/dev/null)"
      - name: Read the subject the SBOM names
        # Runs whether or not anything will be attested. A document that
        # disagrees with the archive beside it is wrong on a private
        # repository too, and there the check is the only thing left.
        id: sbom
        if: inputs.sbom_pattern != ''
        shell: bash
        env:
          SBOM_PATTERN: ${{ inputs.sbom_pattern }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::sbom_pattern needs jq on this runner" >&2; exit 1; }
          # The build runner is the product's to declare, so neither digest
          # tool is assumed: Linux carries sha256sum, macOS carries it in
          # /sbin and shasum everywhere, and a self-hosted runner carries
          # whichever it was built with.
          digest_of() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum <"$1" | cut -d' ' -f1
            else shasum -a 256 <"$1" | cut -d' ' -f1; fi
          }
          # The glob is a find argument, never a shell word: this shell
          # never expands it against the working directory.
          found=""
          count=0
          while IFS= read -r path; do
            # A here-string built from no output still feeds one empty line,
            # and an empty document name would leave the attestation step
            # skipped without a word: the silence this entry exists to end.
            [ -n "$path" ] || continue
            found="$found $path"
            count=$((count + 1))
            document="$path"
          done <<<"$(find dist -maxdepth 1 -type f -name "$SBOM_PATTERN" | sort)"
          if [ "$count" -eq 0 ]; then
            echo "::error::sbom_pattern is $SBOM_PATTERN and dist/ holds no such document" >&2
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::$SBOM_PATTERN names $count documents in dist/ ($found ); an attestation carries one predicate, so declare a glob naming one per target" >&2
            exit 1
          fi
          # The document names its own subject. SPDX says so with a DESCRIBES
          # relationship or the documentDescribes shorthand, and the element
          # it points at carries packageFileName or fileName with its
          # checksums; CycloneDX says so with metadata.component and its
          # hashes. The socle reads that and nothing else: pairing by file
          # name would be a convention, and attesting every package of the
          # target would attribute one component list to archives assembled
          # by format. Naming a subject wrongly is worse than naming none.
          short="${document##*/}"
          named="$(jq -r '
            . as $doc
            | if $doc.spdxVersion then
                ((($doc.documentDescribes // [])
                  + [$doc.relationships[]?
                     | select(.relationshipType == "DESCRIBES")
                     | .relatedSpdxElement]) | unique) as $ids
                | (($doc.packages // []) + ($doc.files // []))
                | map(select(.SPDXID as $i | $ids | index($i)))[]
                | [(.packageFileName // .fileName // ""),
                   ((.checksums // [] | map(select(.algorithm == "SHA256"))
                     | first | .checksumValue) // "")]
                | @tsv
              else
                $doc.metadata.component as $c
                | [($c.name // ""),
                   (($c.hashes // [] | map(select(.alg == "SHA-256"))
                     | first | .content) // "")]
                | @tsv
              end
            ' "$document" 2>/dev/null || true)"
          # A document may point at nothing, or at an element that is not
          # there. Both leave this empty, and both are a refusal.
          if [ -z "$named" ]; then
            echo "::error::$short names no subject: an SPDX document needs a DESCRIBES relationship (or documentDescribes) reaching an element with packageFileName, a CycloneDX document needs metadata.component" >&2
            exit 1
          fi
          subjects=""
          while IFS="$(printf '\t')" read -r name want; do
            [ -n "$name" ] || { echo "::error::$short describes an element that names no file" >&2; exit 1; }
            [ -n "$want" ] || { echo "::error::$short records no SHA-256 for $name" >&2; exit 1; }
            [ -f "dist/$name" ] || { echo "::error::$short describes $name, which target $TARGET did not build" >&2; exit 1; }
            got="$(digest_of "dist/$name")"
            if [ "$got" != "$want" ]; then
              echo "::error::$short records $want for $name and dist/$name is $got; the document does not describe what would be published" >&2
              exit 1
            fi
            echo "the SBOM describes $name and its digest agrees"
            subjects="${subjects}dist/$name"$'\n'
          done <<<"$named"
          {
            echo "document=$document"
            echo "subjects<<SUBJECTS"
            printf '%s' "$subjects"
            echo "SUBJECTS"
          } >>"$GITHUB_OUTPUT"
      - name: Provenance attestation
        id: provenance
        if: inputs.attestation == 'always' || (inputs.attestation == 'auto' && !github.event.repository.private)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: SBOM attestation
        id: sbom-attestation
        if: steps.sbom.outputs.document != '' && steps.provenance.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.sbom.outputs.subjects }}
          sbom-path: ${{ steps.sbom.outputs.document }}
      - name: Keep both attestation bundles with the artifacts
        # A verifier offline needs the predicates, not a promise that GitHub
        # holds them. One bundle without the other says nothing: provenance
        # alone does not bind the SBOM to the archive, and the SBOM predicate
        # alone does not say where either came from. The names carry the
        # target, because publish assembles every target into one directory.
        if: steps.provenance.outcome == 'success'
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE" "dist/${PRODUCT}-${TARGET}.provenance.intoto.jsonl"
          if [ -n "$SBOM_BUNDLE" ]; then
            cp "$SBOM_BUNDLE" "dist/${PRODUCT}-${TARGET}.sbom.intoto.jsonl"
          fi
      - name: No provenance attestation
        if: inputs.attestation == 'never' || (inputs.attestation == 'auto' && github.event.repository.private)
        env:
          ATTESTATION: ${{ inputs.attestation }}
          SBOM_DOCUMENT: ${{ steps.sbom.outputs.document }}
        run: |
          reason="private repository: GitHub reserves attestations to paid plans"
          test "$ATTESTATION" != never || reason="the attestation input is never"
          echo "::notice::no provenance attestation ($reason); the signed tag and SHA256SUMS remain"
          if [ -n "$SBOM_DOCUMENT" ]; then
            echo "::notice::the SBOM is published but not attested ($reason): it names the file it describes and the socle checked that digest, but nothing signs that link. A consumer has the document, not a proof it belongs to this archive"
          fi
      - name: Hand the artifacts to publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          # The artifacts exist to cross one run, not to be kept: publish
          # deletes them, and a day is the ceiling if it never runs.
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: write
    steps:
      - name: Collect what build produced
        # Each target keeps its own incoming/dist-TARGET/ directory. Merged
        # into one, the archives extract in parallel over each other and a
        # name two targets both produce is raced rather than resolved; the
        # step below needs them apart to see that at all.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: incoming
      - name: Assemble and verify
        # Word splitting of manifest_patterns is bash's, not the runner's default.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRODUCT: ${{ inputs.product }}
          MANIFEST_PATTERNS: ${{ inputs.manifest_patterns }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_PATTERNS" || { echo "manifest_patterns names no glob" >&2; exit 1; }
          # The globs are find arguments, never shell words: -f keeps this
          # shell from expanding them against the working directory.
          set -f
          set --
          for pattern in $MANIFEST_PATTERNS; do set -- "$@" -o -name "$pattern"; done
          shift
          set +f
          # The attestation bundles travel with the packages: a verifier
          # offline needs the predicates themselves. They carry their target
          # in their name, so the check below holds them to the same rule.
          mkdir -p dist
          # A name that reaches the release must name one file. When two
          # targets produce the same name, the release keeps one set of bytes
          # and SHA256SUMS vouches for it: the manifest agrees with itself and
          # describes a file the other target never built. Identical bytes are
          # the one harmless case, so the test is the digest and not the name.
          find incoming -type f \( "$@" -o -name '*.sha256' -o -name '*.intoto.jsonl' \) -print0 \
            | while IFS= read -r -d '' path; do
                printf '%s\t%s\t%s\n' "${path##*/}" \
                  "$(sha256sum <"$path" | cut -d' ' -f1)" "$path"
              done | sort >"${RUNNER_TEMP:-.}/incoming.index"
          clashes="$(awk -F'\t' '
            { if (($1 in seen) && seen[$1] != $2) { clash[$1] = 1 }
              seen[$1] = $2
              where[$1] = where[$1] sprintf("\n    %s  %s", $2, $3) }
            END { for (name in clash)
                    printf "%s is built by more than one target, with different bytes:%s\n", \
                           name, where[name] }
          ' "${RUNNER_TEMP:-.}/incoming.index")"
          if [ -n "$clashes" ]; then
            printf 'the targets disagree on what these files are:\n%s\n' "$clashes" >&2
            echo "name each one after its target, or declare a single target in [targets]" >&2
            exit 1
          fi
          # The bytes come from the build's artifacts, never from a draft a
          # writing job could have edited between the two.
          find incoming -type f \( "$@" -o -name '*.sha256' -o -name '*.intoto.jsonl' \) -exec cp {} dist/ \;
          (cd dist && sha256sum -c -- ./*.sha256)
          # Only the archive kinds the product actually built: a library ships
          # tarballs alone, a command may add deb and rpm packages, and
          # manifest_patterns names any other kind it publishes.
          (cd dist && find . -maxdepth 1 -type f \( "$@" \) \
            | sed 's|^\./||' | sort | xargs sha256sum >SHA256SUMS)
          test -s dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRODUCT: ${{ inputs.product }}
        # One job creates the release, fills it and publishes it, and it is
        # the only job of this workflow holding a write token. A replay
        # redrafts and empties an existing release first, so a published tag
        # never keeps an asset of a former attempt.
        run: |
          set -euo pipefail
          if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>/dev/null)"; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --draft
            release_id="$(jq -r .id <<<"$release")"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" \
              --jq '.[].id' | while read -r asset_id; do
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
              done
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "$PRODUCT $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --title "$PRODUCT $TAG" --draft=false
