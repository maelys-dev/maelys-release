name: release (reusable)

# Reusable release of one Maelys product on a signed tag: verify the tag and
# VERSION, build the packages on every target, attest their provenance and
# publish one GitHub release with SHA256SUMS. On a private repository the
# attestation is skipped (input `attestation`). The product supplies
# `scripts/package-release.sh TARGET` writing into dist/, its `dependencies/` pins
# and packages. Runner inputs are JSON: a label string such as "macos-15" or
# a label array such as ["self-hosted","macOS","ARM64"].
on:
  workflow_call:
    inputs:
      product:
        description: Package and binary name, for example maelys-egress
        required: true
        type: string
      tag:
        description: Existing signed tag to release; defaults to the triggering tag
        required: false
        type: string
        default: ""
      dependency_checkout:
        description: Shell lines run before packaging (pinned dependency checkouts)
        required: false
        type: string
        default: ""
      linux_packages:
        description: apt packages installed on Linux runners
        required: false
        type: string
        default: build-essential dpkg-dev file rpm
      macos_packages:
        description: brew packages installed on macOS runners
        required: false
        type: string
        default: ""
      package_command:
        description: Command producing dist/ for one target; TARGET is substituted
        required: false
        type: string
        default: bash scripts/package-release.sh TARGET
      linux_x86_64_runner:
        required: false
        type: string
        default: '"ubuntu-26.04"'
      linux_arm64_runner:
        required: false
        type: string
        default: '"ubuntu-26.04-arm"'
      macos_runner:
        description: >-
          This job builds only after `verify` accepts a GitHub-verified
          signed tag, so a self-hosted runner is safe here on a public
          repository too: the trust boundary is the signature, not who can
          open a pull request.
        required: false
        type: string
        default: '["self-hosted","macOS","maelys"]'
      release_environment:
        required: false
        type: string
        default: release
      attestation:
        description: >-
          auto attests provenance on a public repository and skips it on a
          private one (GitHub reserves attestations there to paid plans);
          always and never force it
        required: false
        type: string
        default: auto
    outputs:
      tag:
        value: ${{ jobs.verify.outputs.tag }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify version and signed annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "v$(cat VERSION)" = "$TAG"
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r .object.type <<<"$ref")" = tag || { echo "$TAG is not an annotated tag" >&2; exit 1; }
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref")")"
          test "$(jq -r .verification.verified <<<"$object")" = true || { echo "$TAG is not verified by GitHub" >&2; exit 1; }
          head="$(git rev-parse HEAD)"
          test "$(jq -r .object.sha <<<"$object")" = "$head" || { echo "$TAG does not name $head" >&2; exit 1; }
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  prepare:
    needs: verify
    runs-on: ubuntu-26.04
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: write
    steps:
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>/dev/null)"; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --draft
            release_id="$(jq -r .id <<<"$release")"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" \
              --jq '.[].id' | while read -r asset_id; do
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
              done
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "$PRODUCT $TAG" --generate-notes --verify-tag
          fi

  build:
    needs: [verify, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.linux_x86_64_runner }}
            target: linux-x86_64
          - runner: ${{ inputs.linux_arm64_runner }}
            target: linux-arm64
          - runner: ${{ inputs.macos_runner }}
            target: macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}
      - name: Pinned dependency checkouts
        if: inputs.dependency_checkout != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.dependency_checkout }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && inputs.linux_packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.linux_packages }}
      - name: Install macOS packages
        if: runner.os == 'macOS' && inputs.macos_packages != ''
        run: brew install ${{ inputs.macos_packages }}
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Package
        shell: bash
        env:
          PACKAGE_COMMAND: ${{ inputs.package_command }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "${PACKAGE_COMMAND//TARGET/$TARGET}"
          test -n "$(ls dist 2>/dev/null)"
      - name: Provenance attestation
        if: inputs.attestation == 'always' || (inputs.attestation == 'auto' && !github.event.repository.private)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: No provenance attestation
        if: inputs.attestation == 'never' || (inputs.attestation == 'auto' && github.event.repository.private)
        env:
          ATTESTATION: ${{ inputs.attestation }}
        run: |
          reason="private repository: GitHub reserves attestations to paid plans"
          test "$ATTESTATION" != never || reason="the attestation input is never"
          echo "::notice::no provenance attestation ($reason); the signed tag and SHA256SUMS remain"
      - name: Upload package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber dist/*

  publish:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: write
    steps:
      - name: Assemble and verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p incoming dist
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir incoming
          find incoming -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sha256' \) -exec cp {} dist/ \;
          (cd dist && sha256sum -c -- ./*.sha256)
          # Only the archive kinds the product actually built: a library ships
          # tarballs alone, a command may add deb and rpm packages.
          (cd dist && find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) \
            | sed 's|^\./||' | sort | xargs sha256sum >SHA256SUMS)
          test -s dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRODUCT: ${{ inputs.product }}
        run: |
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber dist/SHA256SUMS
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --title "$PRODUCT $TAG" --draft=false
