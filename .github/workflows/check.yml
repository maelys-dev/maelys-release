name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install shellcheck and actionlint
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y shellcheck
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /usr/local/bin >/dev/null
      - if: runner.os == 'Linux'
        run: actionlint .github/workflows/*.yml
      - if: runner.os == 'Linux'
        run: shellcheck share/templates/checkout-dependency.sh share/templates/checkout-dependencies.sh
      - name: Contract of the CLI
        run: |
          python3 -m py_compile bin/maelys-release
          bin/maelys-release describe --format json --compact >/dev/null
          bin/maelys-release version --json --compact
      - name: Self-test on a fixture
        run: bin/maelys-release self-test
      - name: Refactoring preserves the recorded CLI behavior
        if: startsWith(github.head_ref, 'refactor/')
        run: |
          python3 tests/golden/capture.py "$RUNNER_TEMP/maelys-golden-replay"
          diff -ru tests/golden/baseline "$RUNNER_TEMP/maelys-golden-replay"
      - name: The socle follows its own conventions
        # What it verifies in every product, verified here: its managed
        # blocks, its declarations, its docs. It drifted from 0.16.0 to 0.57.0
        # because nothing ran this on the repository that writes the rules.
        run: bin/maelys-release check . --product maelys-release
      - name: The CLI reference follows describe
        if: runner.os == 'Linux'
        # The socle documents its own command line the way it documents a
        # product's, and through the same code: read_declarations finds
        # docs/cli.reference, render_cli_reference fetches maelys-cli's
        # generator at dependencies/maelys-cli.pin. A generator that did not
        # run leaves the files as they stand, which would pass unseen, so
        # that note fails here.
        run: |
          python3 - <<'PY'
          import difflib, importlib.machinery, importlib.util, pathlib, sys
          loader = importlib.machinery.SourceFileLoader("socle", "bin/maelys-release")
          spec = importlib.util.spec_from_loader("socle", loader)
          socle = importlib.util.module_from_spec(spec)
          loader.exec_module(socle)
          root = pathlib.Path(".").resolve()
          decl = socle.read_declarations(root, "maelys-release", "custom")
          markdown, contract = socle.render_cli_reference(decl)
          failed = [check["message"] for check in decl.checks if "did not run" in check["message"]
                    or "not available" in check["message"]]
          for name, fresh in (("docs/cli.md", markdown), ("docs/cli-contract.json", contract)):
              current = (root / name).read_text(encoding="utf-8")
              if current != fresh:
                  sys.stdout.writelines(difflib.unified_diff(current.splitlines(True), fresh.splitlines(True), name, name))
                  failed.append(f"{name} does not follow describe: regenerate it")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print("docs/cli.md and docs/cli-contract.json follow describe")
          PY
