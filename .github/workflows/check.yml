name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Install shellcheck and actionlint
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 /usr/local/bin >/dev/null
      - if: runner.os == 'Linux'
        run: actionlint .github/workflows/*.yml
      - if: runner.os == 'Linux'
        run: shellcheck share/templates/checkout-dependency.sh
      - name: Contract of the CLI
        run: |
          python3 -m py_compile bin/maelys-release
          bin/maelys-release describe --format json --compact >/dev/null
          bin/maelys-release version --json --compact
      - name: Self-test on a fixture
        run: bin/maelys-release self-test
