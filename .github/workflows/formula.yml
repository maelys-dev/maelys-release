name: formula

# This repository publishes no artifact: its release is the signed tag alone,
# which products pin by commit. This pushes a Homebrew formula that points at
# the tag's own source archive -- the one GitHub builds, not a file this
# repository uploads -- so that an operator can install the command instead of
# keeping a checkout. The tag stays the release; the formula is a pointer to
# it.
#
# Without the tap credentials, tap.yml renders the formula, lints it, and says
# in a warning that it pushed nothing, keeping it as an artifact. Adding this
# repository to the organisation secret's list is the operator's gesture, not
# the socle's.
on:
  push:
    tags: ["v*"]
  # A formula that failed to go out is replayed on the tag it already has,
  # as every publication of this fleet is: the tag never moves.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing signed tag to publish the formula for.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The socle holds itself to the contract it holds products to. release.yml
  # does this for a product before it builds anything; this repository does
  # not run release.yml -- its release is the signed tag alone -- so the rule
  # would have applied to nine products and not to the one that writes it.
  # Here it applies to both.
  signed:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is signed by a key this repository names, and landed on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        # The allowed signers of the tag itself: a product reads the list at
        # the socle commit it pinned, and the socle has no earlier socle to
        # read -- so it reads the list this very tag publishes, which is the
        # list a reader of that tag would see. What keeps that from being a
        # circle is the last check: the commit must already be on main,
        # where the branch's own rules stand.
        run: |
          set -euo pipefail
          test "v$(git show "${TAG}:VERSION")" = "$TAG" \
            || { echo "${TAG} does not name the VERSION its commit carries" >&2; exit 1; }
          test "$(git cat-file -t "$TAG")" = tag \
            || { echo "${TAG} is not an annotated tag" >&2; exit 1; }
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main \
            || { echo "${TAG} is not on main: a tag on a branch publishes nothing" >&2; exit 1; }
          signers="$(git show "${TAG}:share/allowed-signers")"
          test -n "$signers" || { echo "${TAG} names no allowed signer" >&2; exit 1; }
          printf '%s\n' "$signers" >"$RUNNER_TEMP/allowed-signers"
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}" >"$RUNNER_TEMP/tag.json"
          jq -rj .verification.payload "$RUNNER_TEMP/tag.json" >"$RUNNER_TEMP/payload"
          jq -rj .verification.signature "$RUNNER_TEMP/tag.json" >"$RUNNER_TEMP/signature"
          grep -q '^-----BEGIN SSH SIGNATURE-----' "$RUNNER_TEMP/signature" \
            || { echo "${TAG} carries no ssh signature" >&2; exit 1; }
          # The moment GitHub saw the tag, which the signer does not write,
          # rather than the clock (a retirement would break every tag the key
          # ever signed) or the tagger date (a stolen key backdates its tag
          # and walks through its own retirement -- measured).
          seen="$(jq -r '.verification.verified_at // empty' "$RUNNER_TEMP/tag.json")"
          test -n "$seen" || { echo "${TAG} carries no verified_at: GitHub did not say when it saw this tag" >&2
                               exit 1; }
          signed_at="$(printf '%s' "$seen" | tr -d ':-' | tr 'T' ' ' | cut -d' ' -f1,2 | tr -d ' ')"
          case "$signed_at" in ''|*[!0-9Zz]*) echo "${TAG} has an unreadable verified_at: ${seen}" >&2; exit 1 ;; esac
          principal="$(ssh-keygen -Y find-principals -O "verify-time=${signed_at}" \
            -f "$RUNNER_TEMP/allowed-signers" -s "$RUNNER_TEMP/signature" | head -n 1)" \
            || { echo "${TAG} is signed by a key this repository did not name on ${signed_at}" >&2; exit 1; }
          test -n "$principal" || { echo "${TAG} is signed by a key this repository does not name" >&2; exit 1; }
          ssh-keygen -Y verify -O "verify-time=${signed_at}" -f "$RUNNER_TEMP/allowed-signers" \
            -I "$principal" -n git -s "$RUNNER_TEMP/signature" <"$RUNNER_TEMP/payload"
          echo "${TAG} is signed by ${principal} and on main: the formula may go"

  formula:
    needs: signed
    # A called workflow may not ask for more than its caller allows, and
    # tap.yml's bottle job asks for these three. Without them the run fails
    # before a single job starts, which leaves no log to read -- measured on
    # v0.62.0, whose formula never went out. The socle writes exactly this
    # on the job of a product that calls release.yml; it had not written it
    # for its own.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/tap.yml
    with:
      product: maelys-release
      tag: ${{ inputs.tag || github.ref_name }}
      formula_template: packaging/homebrew/maelys-release.rb.in
      # No compiled artifact: the formula installs a Python program from the
      # source archive, so there is nothing to bottle.
      bottles: "[]"
    secrets: inherit
