name: legs (reusable)

# The product's own legs of CI, declared in [check] of maelys-release.conf:
# a name, the platform it runs on, and a command. adopt writes the call into
# the product's ci.yml as a job named `legs`, beside the job that calls
# check-product.yml, and takes it away again when [check] is emptied; each
# leg reports as `legs / NAME`, which is what protect requires.
#
# Apart from check-product.yml, and only called by a product that declares a
# leg. The first cut, in 0.55.0's candidate, was a job of check-product.yml
# gated on its input: a skipped matrix job reports under its unevaluated
# name, so every pull request of every product that declared nothing carried
# `check / check (${{ matrix.name }})`. A workflow nobody calls reports
# nothing.
on:
  workflow_call:
    inputs:
      product:
        description: Product name, as given to maelys-release adopt
        required: true
        type: string
      legs:
        description: >-
          The legs, as JSON: [{"name", "platform", "command"}], platform one
          of linux, linux-arm64, macos. Written by adopt from [check].
        required: true
        type: string
      linux_x86_64_runner:
        description: >-
          Runner of a linux leg; a JSON label string or array. Read only on a
          private repository, as in check-product.yml: a pull request reaches
          this workflow, and on a public repository it can carry anyone's code.
        required: false
        type: string
        default: '"ubuntu-26.04"'
      linux_arm64_runner:
        description: Runner of a linux-arm64 leg. Read only on a private repository.
        required: false
        type: string
        default: '"ubuntu-26.04-arm"'
      macos_runner:
        description: Runner of a macos leg. Read only on a private repository.
        required: false
        type: string
        default: '"macos-15"'

permissions:
  contents: read

jobs:
  leg:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    # The name is the leg's, as declared: a protection requires it by that
    # name, and the platform it runs on can change without the name moving.
    name: ${{ matrix.name }}
    runs-on: >-
      ${{ fromJSON(matrix.platform == 'macos'
        && (github.event.repository.private && inputs.macos_runner || '"macos-15"')
        || matrix.platform == 'linux-arm64'
        && (github.event.repository.private && inputs.linux_arm64_runner || '"ubuntu-26.04-arm"')
        || (github.event.repository.private && inputs.linux_x86_64_runner || '"ubuntu-26.04"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the socle this workflow comes from
        id: socle
        shell: bash
        # As in check-product.yml: the socle commit is read from the
        # product's release.yml when the socle generated it, and otherwise
        # from the ci.yml line that calls the shared CI.
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            # An extended expression: BSD sed, on a macos leg, knows no
            # alternation in a basic one.
            sha="$(sed -En 's#.*maelys-release/\.github/workflows/check-(product|legs)\.yml@([0-9a-f]{40}).*#\2#p' .github/workflows/*.yml | head -n 1)"
          fi
          test -n "$sha" || { echo "no workflow of this repository names a maelys-release commit" >&2; exit 1; }
          socle="$RUNNER_TEMP/maelys-release"
          git init -q "$socle"
          git -C "$socle" fetch -q --depth 1 https://github.com/maelys-dev/maelys-release.git "$sha"
          git -C "$socle" checkout -q FETCH_HEAD
          echo "dir=$socle" >>"$GITHUB_OUTPUT"
          "$socle/bin/maelys-release" declarations . --product "${{ inputs.product }}" --format json --compact >"$RUNNER_TEMP/declarations.json"
          python3 - "$RUNNER_TEMP/declarations.json" >>"$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]
          print("dependencies=" + " ".join(data["dependencies"]))
          print("apart=" + ("1" if data.get("declared", {}).get("dependenciesApart") else ""))
          print("linux_packages=" + data["linuxPackages"])
          print("macos_packages=" + data["macosPackages"])
          PY
      - name: Pinned dependency checkouts, beside the product
        if: steps.socle.outputs.dependencies != '' && steps.socle.outputs.apart == ''
        shell: bash
        run: |
          set -euo pipefail
          for name in ${{ steps.socle.outputs.dependencies }}; do sh scripts/checkout-dependency.sh "$name"; done
      - name: Pinned dependency checkouts, apart
        if: steps.socle.outputs.dependencies != '' && steps.socle.outputs.apart != ''
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/checkout-dependencies.sh || {
            echo "::error::scripts/checkout-dependencies.sh is missing: run 'maelys-release adopt . --apply'" >&2
            exit 1
          }
          sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y build-essential clang ${{ steps.socle.outputs.linux_packages }}
      - name: Install macOS packages
        if: runner.os == 'macOS' && steps.socle.outputs.macos_packages != ''
        run: brew install ${{ steps.socle.outputs.macos_packages }}
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Check
        shell: bash
        env:
          LEG_COMMAND: ${{ matrix.command }}
        run: eval "$LEG_COMMAND"
